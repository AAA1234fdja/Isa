[package]
name = "isa"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local chat and experimental supervised coding tools"
repository = "https://github.com/AAA1234fdja/Isa"
default-run = "isa"

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
similar = "2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = "1"
# OS-backed cryptographic randomness on supported platforms, including Windows.
getrandom = "0.2"
# No external HTTP/file schema resolution; use a bounded, linear-time regex engine.
jsonschema = { version = "=0.30.0", default-features = false }
base64 = "0.22"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

[target.'cfg(windows)'.dependencies]
# Windows process supervision and staged filesystem protection components.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
