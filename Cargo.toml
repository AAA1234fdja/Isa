[package]
name = "isa"
version = "0.1.0"
edition = "2021"
default-run = "isa"

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
similar = "2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
